<div class="field" style="--field-width: {{ widthOf($.width) }}">
    <label class="label" for="control">{{ $._label }}</label>
    <div class="box">
        <input id="control" class="control" type="datetime-local" min="{{ $.localMin }}" max="{{ $.localMax }}" step="{{ $.step }}" aria-required="{{ $.required ? 'true' : null }}" disabled="{{ $.disabled || $.locked }}" readonly="{{ $.readonly }}" aria-describedby="{{ zoneDescribedBy($.showZone, $._help, $.message) }}" aria-invalid="{{ $.error !== '' ? 'true' : null }}" value="{{ $.local }}" bind="value" onblur="{{ onBlur }}" />
    </div>
    <div class="messages">
        <p class="zone" id="zone" if="{{ $.showZone }}">{{ $.zoneText }}</p>
        <p class="help" id="help" if="{{ $._help !== '' }}">{{ $._help }}</p>
        <div class="alert" role="status" aria-live="polite">
            <p class="error" id="error" if="{{ $.message !== '' }}">{{ $.message }}</p>
        </div>
    </div>
</div>
