<div class="field" style="--field-width: {{ widthOf($.width) }}">
    <label class="label" for="control">{{ $._label }}</label>
    <div class="box">
        <input id="control" class="control" type="date" min="{{ $.min }}" max="{{ $.max }}" disabled="{{ $.disabled || $.locked }}" readonly="{{ $.readonly }}" aria-describedby="{{ describedBy($._help, $.message) }}" aria-invalid="{{ $.error !== '' ? 'true' : null }}" value="{{ $.value }}" bind="value" onblur="{{ onBlur }}" />
    </div>
    <div class="messages">
        <p class="help" id="help" if="{{ $._help !== '' }}">{{ $._help }}</p>
        <div class="alert" role="status" aria-live="polite">
            <p class="error" id="error" if="{{ $.message !== '' }}">{{ $.message }}</p>
        </div>
    </div>
</div>
