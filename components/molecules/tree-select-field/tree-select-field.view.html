<div class="field" style="--field-width: {{ widthOf($.width) }}">
    <label class="label" for="control">{{ $._label }}</label>
    <div class="box">
        <ui-icon class="icon" if="{{ $.icon !== '' }}" state=".glyph" size="{{ $.size }}"></ui-icon>
        <button id="control" class="control" type="button" role="combobox" aria-haspopup="tree" aria-controls="tree" aria-expanded="{{ $.open ? 'true' : 'false' }}" aria-activedescendant="{{ $.activeId !== '' ? $.activeId : null }}" disabled="{{ $.disabled || $.locked }}" aria-readonly="{{ $.readonly ? 'true' : null }}" aria-required="{{ $.required ? 'true' : null }}" aria-describedby="{{ describedBy($._help, $.message) }}" aria-invalid="{{ $.error !== '' ? 'true' : null }}" title="{{ $.fullPath !== '' ? $.fullPath : null }}" data-empty="{{ $.text === '' ? '' : null }}" onclick="{{ onToggle }}" onkeydown="{{ onKeyDown }}" onblur="{{ onBlur }}">{{ $.text !== '' ? $.text : $._placeholder }}</button>
    </div>
    <div class="messages">
        <p class="help" id="help" if="{{ $._help !== '' }}">{{ $._help }}</p>
        <div class="alert" role="status" aria-live="polite">
            <p class="error" id="error" if="{{ $.message !== '' }}">{{ $.message }}</p>
        </div>
    </div>
</div>
<div class="popup" id="tree" popover="manual" role="tree" aria-label="{{ $._label }}" onpointerdown="{{ onPopupDown }}" onclick="{{ onPick }}">
    <div class="row" repeat="{{ $k,$i,$v in $.rows }}" key="{{ $k }}" id="{{ $v.id }}" role="treeitem" data-key="{{ $v.key }}" aria-level="{{ $v.level }}" aria-expanded="{{ $v.hasChildren ? ($v.expanded ? 'true' : 'false') : null }}" aria-selected="{{ $v.selected ? 'true' : 'false' }}" data-active="{{ $v.active ? '' : null }}" style="--tree-level: {{ $v.level }}">
        <span class="twisty" data-toggle="" aria-hidden="true" if="{{ $v.hasChildren }}"><ui-icon size="sm" name="{{ $v.expanded ? 'chevron-down' : 'chevron-right' }}"></ui-icon></span>
        <span class="twisty" aria-hidden="true" if="{{ !$v.hasChildren }}"></span>
        <span class="text">{{ $v.label }}</span>
    </div>
    <div class="hint" if="{{ $.open &amp;&amp; $.count === 0 }}">{{ $._empty }}</div>
</div>
