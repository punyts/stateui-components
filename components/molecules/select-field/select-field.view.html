<div class="field" style="--field-width: {{ widthOf($.width) }}">
    <label class="label" for="control">{{ $._label }}</label>
    <div class="box">
        <ui-icon class="icon" if="{{ $.icon !== '' }}" state=".glyph" size="{{ $.size }}"></ui-icon>
        <select id="control" class="control" multiple="{{ $.multiple }}" disabled="{{ $.disabled || $.locked }}" aria-describedby="{{ describedBy($._help, $.message) }}" aria-invalid="{{ $.error !== '' ? 'true' : null }}" onchange="{{ onChange }}" onblur="{{ onBlur }}"><option repeat="{{ $k,$i,$v in $.options }}" key="{{ $k }}" value="{{ valueOf($k, $v, $.optionValue) }}">{{ labelOf($v, $.optionLabel, $v._label) }}</option></select>
    </div>
    <div class="messages">
        <p class="help" id="help" if="{{ $._help !== '' }}">{{ $._help }}</p>
        <div class="alert" role="status" aria-live="polite">
            <p class="error" id="error" if="{{ $.message !== '' }}">{{ $.message }}</p>
        </div>
    </div>
</div>
