<div class="surface" role="{{ $.interactive ? 'button' : null }}" tabindex="{{ $.interactive ? 0 : null }}" aria-pressed="{{ $.interactive ? ($.selected ? 'true' : 'false') : null }}" onclick="{{ onClick }}" onkeydown="{{ onKeyDown }}" onpress="{{ onInnerPress }}">
    <div class="media" if="{{ $.media }}">
        <sui-node state=".media"></sui-node>
    </div>
    <div class="header" if="{{ $.loading || ($._title !== '') || ($._subtitle !== '') || $.actions }}">
        <div class="heading">
            <ui-skeleton class="title-skeleton" if="{{ $.loading }}" width="50%"></ui-skeleton>
            <div class="title" if="{{ !$.loading &amp;&amp; ($._title !== '') }}">{{ $._title }}</div>
            <div class="subtitle" if="{{ !$.loading &amp;&amp; ($._subtitle !== '') }}">{{ $._subtitle }}</div>
        </div>
        <div class="actions" if="{{ $.actions }}">
            <sui-node state=".actions"></sui-node>
        </div>
    </div>
    <div class="body" layout-host="">
        <sui-node if="{{ $.children }}" repeat="{{ $k,$i,$v in $.children }}" key="{{ $k }}" state="{{ $v }}"></sui-node>
    </div>
    <div class="body-skeleton" if="{{ $.loading }}">
        <ui-skeleton lines="3"></ui-skeleton>
    </div>
    <div class="footer" if="{{ $.footer }}">
        <sui-node state=".footer"></sui-node>
    </div>
</div>
