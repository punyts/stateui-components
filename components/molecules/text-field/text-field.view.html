<div class="field" style="--field-width: {{ widthOf($.width) }}">
    <label class="label" for="control">{{ $._label }}</label>
    <div class="box">
        <ui-icon class="icon" if="{{ $.icon !== '' }}" state=".glyph" size="{{ $.size }}"></ui-icon>
        <input id="control" class="control" type="{{ $.inputType === 'password' &amp;&amp; $.revealed ? 'text' : $.inputType }}" placeholder="{{ $._placeholder }}" disabled="{{ $.disabled || $.locked }}" readonly="{{ $.readonly }}" aria-describedby="{{ strengthDescribedBy($.level, $._help, $.message) }}" aria-invalid="{{ $.error !== '' ? 'true' : null }}" value="{{ $.value }}" bind="value" onblur="{{ onBlur }}" />
        <button class="reveal" type="button" if="{{ $.inputType === 'password' &amp;&amp; $.reveal }}" aria-label="{{ $.revealed ? $._conceal : $._reveal }}" aria-pressed="{{ $.revealed ? 'true' : 'false' }}" aria-controls="control" disabled="{{ $.disabled || $.locked }}" onclick="{{ onReveal }}">
            <ui-icon name="{{ $.revealed ? 'eye-off' : 'eye' }}" size="sm"></ui-icon>
        </button>
    </div>
    <div class="messages">
        <div class="strength" id="strength" if="{{ $.level !== '' }}" style="--sui-score: {{ $.score }}">
            <span class="track" aria-hidden="true"><span class="fill"></span></span>
            <span class="level">{{ $.levelText }}</span>
        </div>
        <p class="help" id="help" if="{{ $._help !== '' }}">{{ $._help }}</p>
        <div class="alert" role="status" aria-live="polite">
            <p class="error" id="error" if="{{ $.message !== '' }}">{{ $.message }}</p>
        </div>
    </div>
</div>
