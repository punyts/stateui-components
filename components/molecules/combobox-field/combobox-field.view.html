<div class="field" style="--field-width: {{ widthOf($.width) }}">
    <label class="label" for="control">{{ $._label }}</label>
    <div class="box">
        <ui-icon class="icon" if="{{ $.icon !== '' }}" state=".glyph" size="{{ $.size }}"></ui-icon>
        <input id="control" class="control" type="text" role="combobox" autocomplete="off" aria-autocomplete="list" aria-haspopup="listbox" aria-controls="listbox" aria-expanded="{{ $.open ? 'true' : 'false' }}" aria-activedescendant="{{ $.activeId !== '' ? $.activeId : null }}" placeholder="{{ $._placeholder }}" disabled="{{ $.disabled || $.locked }}" readonly="{{ $.readonly }}" aria-describedby="{{ describedBy($._help, $.message) }}" aria-invalid="{{ $.error !== '' ? 'true' : null }}" value="{{ $.text }}" oninput="{{ onInput }}" onkeydown="{{ onKeyDown }}" onblur="{{ onBlur }}" />
    </div>
    <div class="messages">
        <p class="help" id="help" if="{{ $._help !== '' }}">{{ $._help }}</p>
        <div class="alert" role="status" aria-live="polite">
            <p class="error" id="error" if="{{ $.message !== '' }}">{{ $.message }}</p>
        </div>
    </div>
</div>
<div class="popup" id="listbox" popover="manual" role="listbox" aria-label="{{ $._label }}" onpointerdown="{{ onPopupDown }}" onclick="{{ onPick }}">
    <div class="option" repeat="{{ $k,$i,$v in $.results }}" key="{{ $k }}" id="{{ $v.id }}" role="option" data-index="{{ $k }}" aria-selected="{{ $v.selected ? 'true' : 'false' }}" data-active="{{ $v.active ? '' : null }}">{{ $v.label }}</div>
    <div class="hint" role="option" aria-disabled="true" aria-selected="false" if="{{ $.hint !== '' }}">{{ $.hint === 'more' ? $._more : $._empty }}</div>
</div>
