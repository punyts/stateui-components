<div if="{{ $.shape === 'ring' }}" class="ring" role="progressbar" aria-label="{{ $._label }}" aria-valuemin="0" aria-valuemax="{{ $.max }}" aria-valuenow="{{ $.indeterminate ? null : $.value }}" aria-valuetext="{{ $.indeterminate ? null : $.valueText }}">
    <svg class="dial" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" aria-hidden="true" focusable="false">
        <circle class="groove" cx="18" cy="18" r="15.5" pathLength="100" />
        <circle class="arc" cx="18" cy="18" r="15.5" pathLength="100" />
    </svg>
    <span class="value" if="{{ $.showValue &amp;&amp; !$.indeterminate }}" aria-hidden="true">{{ $.valueText }}</span>
</div>
<div else="" class="progress" role="progressbar" aria-label="{{ $._label }}" aria-valuemin="0" aria-valuemax="{{ $.max }}" aria-valuenow="{{ $.indeterminate ? null : $.value }}">
    <div class="bar"></div>
</div>
