<button class="button" type="button" aria-label="{{ $.iconPosition === 'only' ? $._title : null }}" aria-busy="{{ $.busy ? 'true' : null }}" disabled="{{ $.disabled }}" onclick="{{ onClick }}">
    <span class="busy" aria-hidden="true" if="{{ $.busy }}"></span>
    <span class="content">
        <span class="glyph" icon-paths="icon" aria-hidden="true" if="{{ $.icon !== '' }}"></span>
        <span class="label" if="{{ $.iconPosition !== 'only' }}">{{ $._title }}</span>
    </span>
</button>
