<div class="page" onkeydown="{{ onKeyDown }}">
    <header class="header" if="{{ $.header || (($._title !== '') &amp;&amp; !$.compact) }}">
        <sui-node if="{{ $.header }}" state=".header"></sui-node>
        <h1 class="title" if="{{ !$.header &amp;&amp; ($._title !== '') }}">{{ $._title }}</h1>
    </header>
    <div class="bar" if="{{ $.compact }}">
        <button class="toggle" type="button" aria-expanded="{{ $.navOpen ? 'true' : 'false' }}" aria-controls="nav" onclick="{{ onToggleNav }}">
            <ui-icon class="glyph" name="{{ $.navOpen ? 'x' : 'menu-2' }}" size="sm"></ui-icon>
            <span class="toggle-label">{{ $._navLabel }}</span>
        </button>
        <span class="bar-title" if="{{ $._title !== '' }}">{{ $._title }}</span>
    </div>
    <div class="scrim" if="{{ $.compact &amp;&amp; $.navOpen }}" onclick="{{ onCloseNav }}"></div>
    <div class="nav" id="nav" if="{{ $.nav &amp;&amp; ($.navPosition !== 'none') }}" onselect="{{ onNavChosen }}" onpress="{{ onNavChosen }}">
        <sui-node state=".nav"></sui-node>
    </div>
    <main class="main">
        <div class="content">
            <div class="body" layout-host="">
                <sui-node if="{{ $.children }}" repeat="{{ $k,$i,$v in $.children }}" key="{{ $k }}" state="{{ $v }}"></sui-node>
            </div>
        </div>
    </main>
    <footer class="footer" if="{{ $.footer }}">
        <sui-node state=".footer"></sui-node>
    </footer>
    <div class="toasts" if="{{ $.toasts }}">
        <sui-node state=".toasts"></sui-node>
    </div>
</div>
