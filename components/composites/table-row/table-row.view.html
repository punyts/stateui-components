<div class="row" data-odd="{{ ($.slotIndex % 2) === 1 ? '' : null }}">
    <div class="cell" role="cell" if="{{ $.cells }}" repeat="{{ $k,$i,$v in $.cells }}" key="{{ $k }}" data-key="{{ $k }}" data-align="{{ $v.align || 'start' }}">
        <sui-node if="{{ $v.content }}" repeat="{{ $nk,$ni,$np in $v.content }}" key="{{ $nk }}" state="{{ $np }}"></sui-node>
        <span class="text" if="{{ $v.text }}">{{ $v.text }}</span>
    </div>
</div>
