<div class="list" aria-busy="{{ $.loading ? 'true' : null }}" onkeydown="{{ onKeyDown }}" onfocusin="{{ onFocusIn }}" onfocusout="{{ onFocusOut }}">
    <div class="rows" style="--sui-count: {{ $.count }}">
        <div class="probe" aria-hidden="true"></div>
        <div class="slot" if="{{ $.slots }}" repeat="{{ $k,$i,$v in $.slots }}" key="{{ $k }}" data-slot="{{ $k }}" tabindex="{{ $v.slotIndex &gt;= 0 &amp;&amp; $v.slotTab ? 0 : -1 }}" role="{{ ($.role === 'table' || $.role === 'rowgroup') ? 'row' : ($.role === 'listbox' ? 'option' : ($.role === 'tree' ? 'treeitem' : 'listitem')) }}" aria-selected="{{ ($.role === 'listbox' || ((($.role === 'table') || ($.role === 'rowgroup') || ($.role === 'tree')) &amp;&amp; $.selectable)) ? ($v.slotSelected ? 'true' : 'false') : null }}" data-selected="{{ $v.slotSelected ? '' : null }}" data-pending="{{ $v.slotPending ? '' : null }}" aria-busy="{{ $v.slotPending ? 'true' : null }}" aria-hidden="{{ $.role === 'tree' &amp;&amp; $v.slotPending ? 'true' : null }}" aria-setsize="{{ ($.role === 'list' || $.role === 'listbox') &amp;&amp; $v.slotIndex &gt;= 0 ? $.count : (($.role === 'tree' &amp;&amp; $v.slotPosinset &gt; 0) ? $v.slotSetsize : null) }}" aria-posinset="{{ ($.role === 'list' || $.role === 'listbox') &amp;&amp; $v.slotIndex &gt;= 0 ? $v.slotIndex + 1 : (($.role === 'tree' &amp;&amp; $v.slotPosinset &gt; 0) ? $v.slotPosinset : null) }}" aria-level="{{ $.role === 'tree' &amp;&amp; $v.slotIndex &gt;= 0 &amp;&amp; !$v.slotPending ? $v.slotLevel + 1 : null }}" aria-expanded="{{ $.role === 'tree' &amp;&amp; $v.slotIndex &gt;= 0 &amp;&amp; $v.slotExpanded &gt;= 0 ? ($v.slotExpanded === 1 ? 'true' : 'false') : null }}" aria-label="{{ $.role === 'tree' &amp;&amp; $v.slotLabel !== '' ? $v.slotLabel : null }}" aria-rowindex="{{ ($.role === 'table' || $.role === 'rowgroup') &amp;&amp; $v.slotIndex &gt;= 0 ? $v.slotIndex + 1 + $.rowIndexOffset : null }}" hidden="{{ $v.slotIndex &lt; 0 }}" style="--sui-index: {{ $v.slotIndex }}; --sui-level: {{ $v.slotLevel }}">
            <sui-node state="{{ $v }}"></sui-node>
            <div class="pending" aria-hidden="true"><ui-skeleton></ui-skeleton></div>
        </div>
        <div class="placeholder" repeat="{{ $k,$i for $.loadingRows }}" key="{{ $k }}" aria-hidden="true" style="--sui-index: {{ $.loadingFirst + $i }}">
            <ui-skeleton></ui-skeleton>
        </div>
    </div>
    <div class="empty" if="{{ $.empty &amp;&amp; ($.count === 0) }}">
        <sui-node state=".empty"></sui-node>
    </div>
</div>
