<div class="list" aria-busy="{{ $.loading ? 'true' : null }}" onkeydown="{{ onKeyDown }}" onfocusin="{{ onFocusIn }}" onfocusout="{{ onFocusOut }}">
    <div class="rows" style="--sui-count: {{ $.count }}">
        <div class="probe" aria-hidden="true"></div>
        <div class="slot" if="{{ $.slots }}" repeat="{{ $k,$i,$v in $.slots }}" key="{{ $k }}" data-slot="{{ $k }}" tabindex="{{ $v.slotIndex &gt;= 0 &amp;&amp; $v.slotTab ? 0 : -1 }}" role="{{ ($.role === 'table' || $.role === 'rowgroup') ? 'row' : ($.role === 'listbox' ? 'option' : 'listitem') }}" aria-selected="{{ ($.role === 'listbox' || ((($.role === 'table') || ($.role === 'rowgroup')) &amp;&amp; $.selectable)) ? ($v.slotSelected ? 'true' : 'false') : null }}" data-selected="{{ $v.slotSelected ? '' : null }}" aria-setsize="{{ ($.role === 'list' || $.role === 'listbox') &amp;&amp; $v.slotIndex &gt;= 0 ? $.count : null }}" aria-posinset="{{ ($.role === 'list' || $.role === 'listbox') &amp;&amp; $v.slotIndex &gt;= 0 ? $v.slotIndex + 1 : null }}" aria-rowindex="{{ ($.role === 'table' || $.role === 'rowgroup') &amp;&amp; $v.slotIndex &gt;= 0 ? $v.slotIndex + 1 + $.rowIndexOffset : null }}" hidden="{{ $v.slotIndex &lt; 0 }}" style="--sui-index: {{ $v.slotIndex }}">
            <sui-node state="{{ $v }}"></sui-node>
        </div>
        <div class="placeholder" repeat="{{ $k,$i for $.loadingRows }}" key="{{ $k }}" aria-hidden="true" style="--sui-index: {{ $.loadingFirst + $i }}">
            <ui-skeleton></ui-skeleton>
        </div>
    </div>
    <div class="empty" if="{{ $.empty &amp;&amp; ($.count === 0) }}">
        <sui-node state=".empty"></sui-node>
    </div>
</div>
