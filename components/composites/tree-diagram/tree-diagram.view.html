<div class="diagram" role="tree" aria-label="{{ $._label }}" style="inline-size: {{ $.width }}px; block-size: {{ $.height }}px" onclick="{{ onClick }}" ondblclick="{{ onDoubleClick }}" onkeydown="{{ onKeyDown }}">
    <svg class="edges" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" width="{{ $.width }}" height="{{ $.height }}">
        <path repeat="{{ $ek,$ei,$ev in $.edges }}" key="{{ $ek }}" d="{{ $ev.path }}" class="{{ $ev.kind === 'tree' ? 'tree' : 'link' }}" data-kind="{{ $ev.kind }}" data-from="{{ $ev.from }}" data-to="{{ $ev.to }}" data-lit="{{ $ev.lit ? '' : null }}"><title>{{ $ev.label }}</title></path>
    </svg>
    <div class="card" role="treeitem" repeat="{{ $k,$i,$v in $.cards }}" key="{{ $k }}" data-id="{{ $v.id }}" data-left="{{ $v.side &lt; 0 ? '' : null }}" data-placed="{{ $v.placed ? '' : null }}" data-selected="{{ $v.selected ? '' : null }}" aria-selected="{{ $v.selected ? 'true' : 'false' }}" aria-level="{{ $v.level }}" tabindex="{{ $v.tab ? '0' : '-1' }}" style="transform: translate({{ $v.x }}px, {{ $v.y }}px)">
        <sui-node if="{{ $v.ready }}" repeat="{{ $nk,$ni,$nv in $v.node }}" key="{{ $nk }}" state="{{ $nv }}"></sui-node>
    </div>
</div>
